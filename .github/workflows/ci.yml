name: proof

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify:upstream
      - run: npm test
      - run: npm run test:casefold
      - run: npm run fuzz:ci
      - run: npm run test:bridge-timeout
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path vendor/regress-0.11.1/Cargo.toml -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --manifest-path vendor/regress-0.11.1/Cargo.toml --target-dir target/vendor-regress
